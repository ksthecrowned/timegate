appId: com.timegate.employeeapp
tags:
  - qr
  - smoke
---
# Opens QR punch via deep link (scheme timegate). Requires prior login session.
- launchApp
- openLink: timegate://qr-punch
- extendedWaitUntil:
    visible:
      id: "qr_punch_screen"
    timeout: 15000
- assertVisible:
    id: "qr_punch_screen"
