services:
  - type: web
    name: timegate-api
    runtime: node
    rootDir: api
    # face_recognition: venv créé pendant bun run build (scripts/setup-face-venv-linux.sh)
    buildCommand: bun run build
    startCommand: bun run start:prod
    healthCheckPath: /health
    envVars:
      - key: FACE_ENGINE_PYTHON_BIN
        value: .venv/bin/python
      - key: FACE_ENGINE_PERSISTENT
        value: "true"
      - key: FACE_ENGINE_WARMUP
        value: "true"
      - key: FACE_ENGINE_TIMEOUT_MS
        value: "60000"
      - key: FACE_ENGINE_BOOT_TIMEOUT_MS
        value: "90000"
      - key: NODE_ENV
        value: production
      # Seed démo : flag + allowlist obligatoires (sans SKU/ID → aucune org)
      - key: DEMO_AUTO_ATTENDANCE_SEED
        value: "1"
      - key: DEMO_AUTO_ATTENDANCE_SEED_SKUS
        value: ""
      - key: DEMO_AUTO_ATTENDANCE_SEED_COMPANY_IDS
        value: ""
