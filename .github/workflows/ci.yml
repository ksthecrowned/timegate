name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timegate
          POSTGRES_PASSWORD: timegate
          POSTGRES_DB: timegate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timegate -d timegate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://timegate:timegate@localhost:5432/timegate
      JWT_SECRET: ci-test-secret-change-me
      JWT_EXPIRES_IN: 8h
      PORT: 4001
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      TIMEGATE_WAIT_API: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install API dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Prisma generate
        working-directory: api
        run: bunx prisma generate

      - name: Prisma migrate
        working-directory: api
        run: bunx prisma migrate deploy

      - name: Prisma seed
        working-directory: api
        run: bunx prisma db seed

      - name: Build API
        working-directory: api
        run: bunx nest build

      - name: Start API
        working-directory: api
        run: |
          bun run start:prod &
          echo $! > api.pid

      - name: Run use-case tests
        working-directory: api
        run: bun run test:use-cases

      - name: Stop API
        if: always()
        working-directory: api
        run: |
          if [ -f api.pid ]; then kill "$(cat api.pid)" || true; fi

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [dashboard, console]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: bunx tsc --noEmit
